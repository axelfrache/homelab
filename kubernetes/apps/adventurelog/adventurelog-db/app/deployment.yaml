---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adventurelog-db
  template:
    metadata:
      labels:
        app: adventurelog-db
    spec:
      containers:
        - name: db
          image: postgis/postgis:15-3.3
          env:
            - name: POSTGRES_DB
              value: database
            - name: POSTGRES_USER
              value: adventure
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adventurelog-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: adventurelog-db
