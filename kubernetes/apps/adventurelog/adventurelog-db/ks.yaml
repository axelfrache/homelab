---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adventurelog-db
spec:
  interval: 1h
  path: ./kubernetes/apps/adventurelog/adventurelog-db/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: adventurelog
  wait: true
