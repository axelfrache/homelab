---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: adventurelog-app
spec:
  dependsOn:
    - name: adventurelog-db
  interval: 1h
  path: ./kubernetes/apps/adventurelog/adventurelog-app/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: adventurelog
  wait: true
