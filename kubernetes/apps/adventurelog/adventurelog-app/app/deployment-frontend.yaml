---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adventurelog-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adventurelog-frontend
  template:
    metadata:
      labels:
        app: adventurelog-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/seanmorley15/adventurelog-frontend:latest
          env:
            - name: PUBLIC_SERVER_URL
              value: "https://explore-api.axelfrache.com"
            - name: ORIGIN
              value: "https://explore.axelfrache.com"
            - name: BODY_SIZE_LIMIT
              value: "Infinity"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
